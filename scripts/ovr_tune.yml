services:
  rocm:
    environment:
      HQ_TIMING: "1"
      PYTHONPATH: /opt/hqtiming
    volumes:
      - <SCRATCHPAD>\gemm\out\w4a16_gemv.so:/opt/hq/w4a16_gemv.so:ro
      - <SCRATCHPAD>\src\rdna3_w4a16.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/kernels/linear/mixed_precision/rdna3_w4a16.py:ro
      - <SCRATCHPAD>\hqtiming:/opt/hqtiming:ro
      - <SCRATCHPAD>\tune\causal_conv1d.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/mamba/ops/causal_conv1d.py:ro
      - <SCRATCHPAD>\tune\fused_sigmoid_gating.py:/usr/local/lib/python3.12/dist-packages/vllm/third_party/flash_linear_attention/ops/fused_sigmoid_gating.py:ro
